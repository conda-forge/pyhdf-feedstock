{% set version = "0.11.7" %}

package:
  name: pyhdf
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pyhdf/pyhdf-{{ version }}.tar.gz
  sha256: 5c015589e0d01c191f70855a016ccd8c19106aba7390c9204f3e2a1b7080d335
  patches:
    - patches/turbojpeg_win.patch
    - patches/sdgetcompress_int.patch

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - setuptools
    - setuptools-scm
    - pip
    - numpy
    - hdf4
    - zlib
  run:
    - numpy
    - python
    - hdf4
    - zlib

test:
  imports:
    - pyhdf
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/fhs/pyhdf
  license: MIT
  license_file: LICENSE
  summary: Python interface to the NCSA HDF4 library

extra:
  recipe-maintainers:
    - djhoese
    - ocefpaf
